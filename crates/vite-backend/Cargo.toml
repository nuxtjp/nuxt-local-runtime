[package]
name = "nuxtjp-vite-backend"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
repository = "https://github.com/nuxtjp/nuxt-local-runtime"
description = "Bounded Vite asset plans for native backends; no server JavaScript"
readme = "README.md"
include = ["src/**", "tests/**", "test-data/**", "README.md", "Cargo.toml", "LICENSE", "NOTICE"]

[dependencies]
vite-manifest = "=0.1.0"
serde_json = "1.0.150"
percent-encoding = "=2.3.2"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
